version: '3.8'

services:
  app:
    image: registry.avuz.app/admin/avuz-conecta:latest
    restart: unless-stopped
    # Auto-restart on unhealthy is handled by the host's standalone autoheal stack
    # (portainer-autoheal-stack.yml). The image bakes in `LABEL autoheal=true`, so no
    # label is needed here — deploy one autoheal stack per host and this is covered.
    ports:
      - "8080:80"
    volumes:
      - nextcloud_data:/var/www/html/data
      - nextcloud_config:/var/www/html/config
      - nextcloud_apps:/var/www/html/custom_apps
    environment:
      # Database Configuration (update with your DB credentials)
      - POSTGRES_HOST=your-db-host
      - POSTGRES_DB=your-db-name
      - POSTGRES_USER=your-db-user
      - POSTGRES_PASSWORD=your-db-password

      # Redis Configuration
      # Leave empty or set to "localhost" to use internal Redis (default)
      # Or set to external Redis host if you have one
      - REDIS_HOST=

      # Nextcloud Admin User
      - NEXTCLOUD_ADMIN_USER=admin
      - NEXTCLOUD_ADMIN_PASSWORD=ChangeThisPassword123

      # Trusted Domains — comma-separated list for multi-host serving.
      # NEXTCLOUD_TRUSTED_DOMAIN (singular) = primary, used for overwrite.cli.url + theming.
      # NEXTCLOUD_TRUSTED_DOMAINS (plural) = full list, each entry gets its own trusted_domains index.
      # Include the recording upload domain (DNS-only, CF-bypassed) so NC accepts those requests.
      - NEXTCLOUD_TRUSTED_DOMAIN=app3.avuz.app
      - NEXTCLOUD_TRUSTED_DOMAINS=app3.avuz.app,recording.avuz.app
      - OVERWRITEPROTOCOL=https

      # TRUSTED_PROXIES — NPM IP(s) as this container sees them (comma-separated).
      # Feeds NC trusted_proxies + nginx set_real_ip_from so the real client IP is
      # taken from Cloudflare's CF-Connecting-IP. Set per stack: staging vs prod differ.
      - TRUSTED_PROXIES=10.50.99.254

      # PHP per-request ceiling (not pre-allocated). Stock is 512M; raised so heavy
      # occ jobs (FilesMetadata, scans, previews) don't trip the 300MB cron warning
      # or OOM mid-request. Override per-stack if host RAM is tight.
      - PHP_MEMORY_LIMIT=3072M

      # SMTP Configuration (optional - leave empty to skip)
      - SMTP_HOST=
      - SMTP_PORT=587
      - SMTP_SECURE=tls
      - SMTP_NAME=
      - SMTP_PASSWORD=
      - SMTP_AUTHTYPE=LOGIN
      - SMTP_FROM=
      - SMTP_DOMAIN=

      # OnlyOffice Configuration (optional - leave empty to skip)
      - ONLYOFFICE_URL=
      - ONLYOFFICE_SECRET=

      # S3/MinIO object store (optional — leave OBJECTSTORE_S3_BUCKET empty to use local filesystem)
      # Must be set BEFORE first install on fresh stacks; switching later is a one-way door.
      - OBJECTSTORE_S3_BUCKET=
      - OBJECTSTORE_S3_KEY=
      - OBJECTSTORE_S3_SECRET=
      - OBJECTSTORE_S3_HOSTNAME=
      - OBJECTSTORE_S3_PORT=9000
      - OBJECTSTORE_S3_USE_SSL=false
      - OBJECTSTORE_S3_USE_PATH_STYLE=true
      - OBJECTSTORE_S3_REGION=us-east-1
      # See docs/s3-deployment.md — false skips NC's HeadBucket/CreateBucket
      # probe (NC's `autocreate` flag is Swift-only and a no-op for S3).
      - OBJECTSTORE_S3_VERIFY_BUCKET_EXISTS=false

      # Roundcube webmail integration (optional - leave empty to skip)
      - ROUNDCUBE_URL=
      - ROUNDCUBE_SSO_SECRET=
      - ROUNDCUBE_CREDENTIAL_KEY=

      # Notifications app from Git (branch name, default: stable33)
      - NOTIFICATIONS_BRANCH=stable33

      # Talk Recording backend (optional)
      # URL + secret of the recording server deployed via portainer-recording-stack.yml
      - TALK_RECORDING_URL=             # e.g. https://recording.avuz.internal or http://10.x.x.x:1234
      - TALK_RECORDING_SECRET=          # must match RECORDING_SECRET in recording stack
      - TALK_RECORDING_VERIFY=true      # false if recording cert is self-signed

      # AI transcription + summary via integration_openai (optional)
      # Leave AI_API_KEY empty to skip AI setup. Split providers:
      #   LLM (summary) → OpenRouter → Anthropic Claude Haiku 4.5
      #   STT (transcription) → Fireworks AI → whisper-large-v3
      - AI_API_KEY=                                    # OpenRouter API key
      - AI_BASE_URL=https://openrouter.ai/api/v1
      - AI_LLM_MODEL=anthropic/claude-haiku-4-5
      - AI_STT_API_KEY=                                # Fireworks AI API key
      - AI_STT_BASE_URL=https://api.fireworks.ai/inference/v1
      - AI_STT_MODEL=whisper-v3
      - AI_STT_LANGUAGE=pt

volumes:
  nextcloud_data:
  nextcloud_config:
  nextcloud_apps:
