[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379 --daemonize no
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
autostart=false
priority=5

[program:php-fpm]
command=php-fpm -F
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=10

[program:nginx]
command=nginx -g 'daemon off;'
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=20

[program:cron]
command=/usr/sbin/crond -f -l 2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=30

[program:nextcloud-cron]
command=/bin/sh -c "while true; do php /var/www/html/cron.php; sleep 300; done"
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=40

[program:nextcloud-taskprocessing]
command=/bin/sh -c "while true; do php /var/www/html/occ background-job:worker -v -t 10 'OC\TaskProcessing\SynchronousBackgroundJob'; sleep 5; done"
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=45

[program:notify-push]
command=/bin/sh -c "if [ -f /var/www/html/custom_apps/notify_push/bin/x86_64/notify_push ]; then /var/www/html/custom_apps/notify_push/bin/x86_64/notify_push /var/www/html/config/config.php; else /var/www/html/apps/notify_push/bin/x86_64/notify_push /var/www/html/config/config.php; fi"
user=www-data
environment=PORT=7867
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=50
startsecs=5
exitcodes=0

[program:nextcloud-maintenance]
command=/bin/sh -c "while true; do sleep 86400; php /var/www/html/occ db:add-missing-indices --no-interaction; php /var/www/html/occ maintenance:repair --include-expensive; done"
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=60
