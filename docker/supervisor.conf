[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379 --daemonize no
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
autostart=false
priority=5

[program:php-fpm]
command=php-fpm -F
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=10

[program:nginx]
command=nginx -g 'daemon off;'
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=20

[program:cron]
command=/usr/sbin/crond -f -l 2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=30

[program:nextcloud-cron]
command=/bin/sh -c "while true; do php /var/www/html/cron.php; sleep 300; done"
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=40

[program:nextcloud-taskprocessing]
command=/bin/sh -c "while true; do php /var/www/html/occ background-job:worker -t 300 'OC\TaskProcessing\SynchronousBackgroundJob'; sleep 5; done"
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=45

[program:notify-push]
command=/bin/sh -c "if [ -f /var/www/html/custom_apps/notify_push/bin/x86_64/notify_push ]; then /var/www/html/custom_apps/notify_push/bin/x86_64/notify_push /var/www/html/config/config.php; else /var/www/html/apps/notify_push/bin/x86_64/notify_push /var/www/html/config/config.php; fi"
user=www-data
environment=PORT=7867
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=50
startsecs=5
exitcodes=0

; PHP buffers each S3 multipart part to a /tmp/phpXXXXXX file. The SAPI unlinks
; it when the request ends, but a worker killed mid-upload (OOM, timeout, the
; object store going unreachable) never gets there, and the file is stranded on
; the container overlay forever. Invisible to every storage counter: not in the
; bucket, not in oc_filecache, not in any quota. eco-ambiental accumulated
; 6.6 GB from a single afternoon of failed uploads. Sweeps once at boot, then
; hourly. 12h floor is far beyond any legitimate in-flight upload.
[program:tmp-sweep]
command=/bin/sh -c "while true; do find /tmp -maxdepth 1 -type f -name 'php*' -mmin +720 -exec rm -f {} + 2>/dev/null; sleep 3600; done"
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=65

[program:nextcloud-maintenance]
command=/bin/sh -c "while true; do sleep 86400; php /var/www/html/occ db:add-missing-indices --no-interaction; php /var/www/html/occ maintenance:repair --include-expensive; done"
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=60
