services:
  db:
    image: postgres:16-alpine
    container_name: nextcloud-db
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=nextcloud_db_pass
    networks:
      - nextcloud-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nextcloud-redis
    restart: unless-stopped
    networks:
      - nextcloud-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: avuz-server-app
    container_name: nextcloud-app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - nextcloud_data:/var/www/html/data
      - nextcloud_config:/var/www/html/config
      - nextcloud_apps:/var/www/html/custom_apps
      - ./core:/var/www/html/core:ro
      - ./lib:/var/www/html/lib:ro
      - ./dist:/var/www/html/dist:ro
      - ./themes:/var/www/html/themes:ro
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=nextcloud_db_pass
      - REDIS_HOST=redis
      - NEXTCLOUD_ADMIN_USER=admin
      - NEXTCLOUD_ADMIN_PASSWORD=admin
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost
      - NEXTCLOUD_TRUSTED_DOMAIN=localhost
      - OVERWRITEPROTOCOL=http
      # No Cloudflare/NPM in local dev; requests arrive on loopback (already trusted).
      - TRUSTED_PROXIES=
      - PDF_CONVERTER_FRONTEND_URL=http://pdf-to-excel-frontend:80
      - PDF_CONVERTER_BACKEND_URL=http://pdf-to-excel-backend:8000
      # SMTP Configuration (optional - leave empty to skip SMTP setup)
      - SMTP_HOST=
      - SMTP_PORT=587
      - SMTP_SECURE=tls
      - SMTP_NAME=
      - SMTP_PASSWORD=
      - SMTP_AUTHTYPE=LOGIN
      - SMTP_FROM=
      - SMTP_DOMAIN=
      # OnlyOffice Configuration (optional - leave empty to skip)
      - ONLYOFFICE_URL=
      - ONLYOFFICE_SECRET=
      # S3/MinIO object store (optional — leave OBJECTSTORE_S3_BUCKET empty to use local filesystem)
      # Must be set BEFORE first install on fresh stacks; switching later is a one-way door.
      - OBJECTSTORE_S3_BUCKET=
      - OBJECTSTORE_S3_KEY=
      - OBJECTSTORE_S3_SECRET=
      - OBJECTSTORE_S3_HOSTNAME=
      - OBJECTSTORE_S3_PORT=9000
      - OBJECTSTORE_S3_USE_SSL=false
      - OBJECTSTORE_S3_USE_PATH_STYLE=true
      - OBJECTSTORE_S3_REGION=us-east-1
      # Set to "true" only if your S3 endpoint correctly answers HeadBucket
      # for an existing bucket. MinIO appliances behind some proxies return
      # 400 on HeadBucket and NC then tries CreateBucket, which often also
      # fails. Default "false" trusts that the bucket already exists.
      - OBJECTSTORE_S3_VERIFY_BUCKET_EXISTS=false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nextcloud-network
    # Same probe as the image (docker/healthcheck.sh) so local dev reproduces what
    # staging/prod see, including the diagnostic dump to data/avuz-health.log.
    # No autoheal sidecar here on purpose: locally you want the broken container
    # left standing so you can exec into it.
    healthcheck:
      test: ["CMD", "/var/www/html/docker/healthcheck.sh"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s

volumes:
  db_data:
  nextcloud_data:
  nextcloud_config:
  nextcloud_apps:

networks:
  nextcloud-network:
    driver: bridge
